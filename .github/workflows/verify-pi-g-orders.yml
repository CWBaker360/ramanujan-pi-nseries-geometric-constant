name: Verify pi_g convergence orders

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned mpmath
        run: python -m pip install mpmath==1.3.0

      - name: Reproduce order table at 100 decimal places
        run: python scripts/verify_pi_g_orders.py --precision 100 --output-dir ci-output

      - name: Check verification status
        run: |
          python -c "import json; from pathlib import Path; s=json.loads(Path('ci-output/pi_g_order_summary.json').read_text()); assert s['verification_passed'] is True; assert s['table_values_passed'] is True; assert s['N1024_errors_passed'] is True; assert s['orders_converge_to_2_4_6'] is True"
